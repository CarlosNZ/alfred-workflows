<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Scratch'n'Stick slate</title>
  <!--
    A new note that isn't a sticky note: the tile from Scratch'n'Stick's
    workflow icon (icon.svg) with three lines of writing straight on it, like
    a slate. The writing matches the sticky note's in note.svg at the same
    displayed size (its 40-unit strokes in a 616-unit viewBox), left-aligned
    and centred on the tile. The tile's colours are the gradient in <defs>;
    the writing's colour is on the #writing group.
  -->
  <defs>
    <linearGradient id="tile-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F4EE"/>
      <stop offset="1" stop-color="#E4DED2"/>
    </linearGradient>
  </defs>

  <!-- The tile, filling the canvas: a rounded square with Apple's continuous
       corners (three cubic curves each), corner radius 16% of its width, and
       straight sides between them. Flat sides and smaller corners than
       Apple's app icon template (22.5%) match other workflows' icons in
       Alfred's lists. -->
  <path d="M250.5,0 L773.5,0 C845.7,0 881.7,3.7 914.2,10.7 C963.8,22.9 1001.1,60.2 1013.3,109.8 C1020.3,142.3 1024,178.3 1024,250.5 L1024,773.5 C1024,845.7 1020.3,881.7 1013.3,914.2 C1001.1,963.8 963.8,1001.1 914.2,1013.3 C881.7,1020.3 845.7,1024 773.5,1024 L250.5,1024 C178.3,1024 142.3,1020.3 109.8,1013.3 C60.2,1001.1 22.9,963.8 10.7,914.2 C3.7,881.7 0,845.7 0,773.5 L0,250.5 C0,178.3 3.7,142.3 10.7,109.8 C22.9,60.2 60.2,22.9 109.8,10.7 C142.3,3.7 178.3,0 250.5,0 L773.5,0 Z" fill="url(#tile-fill)"/>

  <!-- Three lines of writing. -->
  <g id="writing" stroke="#4A4237" stroke-opacity="0.6" stroke-width="66.5" stroke-linecap="round" fill="none">
    <line x1="186.2" y1="332.5" x2="837.8" y2="332.5"/>
    <line x1="186.2" y1="512" x2="734.8" y2="512"/>
    <line x1="186.2" y1="691.5" x2="601.8" y2="691.5"/>
  </g>
</svg>
