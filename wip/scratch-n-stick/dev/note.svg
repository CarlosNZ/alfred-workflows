<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="207 194 616 616" width="616" height="616">
  <title>Scratch'n'Stick note</title>
  <!--
    The sticky note from Scratch'n'Stick's workflow icon (icon.svg) on its
    own: the same note, curl and writing, tilted 4° the same way, without the
    tile or the drop shadow that falls on it. The viewBox fits the note and
    its curl's shadow with 6 units to spare. The note's colours are the
    gradients in <defs>; the writing's colour is on the #writing group.

    The curl's shadow is a Gaussian blur, which macOS's own SVG renderer
    (NSImage, Quick Look) draws hard-edged. Render it with rsvg-convert or a
    browser.
  -->
  <defs>
    <linearGradient id="note-fill" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFF6A8"/>
      <stop offset="1" stop-color="#FDE968"/>
    </linearGradient>
    <linearGradient id="curl-fill" x1="1" y1="1" x2="0.4" y2="0.4">
      <stop offset="0" stop-color="#FFFBD8"/>
      <stop offset="1" stop-color="#E9D24A"/>
    </linearGradient>
    <filter id="tight-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <!-- The note's outline, with its bottom-right corner curled up. -->
    <path id="note-shape" d="M250,222 H774 Q792,222 792,240 V632 C754.5,699.5 709.5,744.5 642,782 H250 Q232,782 232,764 V240 Q232,222 250,222 Z"/>
  </defs>

  <g id="note" transform="rotate(-4 512 512)">
    <!-- A tight shadow under the curl. -->
    <path d="M634.5,779 C702,800 777,722 795,629 Z" fill="#000000" opacity="0.22" filter="url(#tight-blur)" transform="translate(-4 10)"/>
    <use xlink:href="#note-shape" fill="url(#note-fill)"/>
    <!-- The curl: the underside of the lifted corner. -->
    <path d="M792,632 C754.5,699.5 709.5,744.5 642,782 C654,699.5 679.5,650 792,632 Z" fill="url(#curl-fill)"/>
    <!-- Three lines of writing. -->
    <g id="writing" stroke="#4A3F00" stroke-opacity="0.6" stroke-width="40" stroke-linecap="round" fill="none">
      <line x1="316" y1="372" x2="708" y2="372"/>
      <line x1="316" y1="480" x2="646" y2="480"/>
      <line x1="316" y1="588" x2="566" y2="588"/>
    </g>
  </g>
</svg>
